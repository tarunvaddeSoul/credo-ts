[package]
name = "anoncreds-wasm"
version = "0.2.3"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anoncreds = { path = "vendor/anoncreds-rs", default-features = false, features = ["zeroize", "w3c"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bs58 = "0.5"
console_error_panic_hook = "0.1"
# force wasm-compatible RNG backends across the dependency tree
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"

# all published core2 versions were yanked from crates.io; vendored from
# https://github.com/technocreatives/core2 (v0.4.0, needed by glass_pumpkin)
[patch.crates-io]
core2 = { path = "vendor/core2" }

[workspace]
